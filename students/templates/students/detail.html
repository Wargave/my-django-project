<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карточка студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; }
        .list-group-item { border: none; padding-left: 0; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto p-4" style="max-width: 500px;">
            <h2 class="text-primary text-center">{{ student.first_name }} {{ student.last_name }}</h2>
            <hr>

            <div class="mb-3">
                <p><strong>Возраст:</strong> {{ student.age }}</p>
                <p><strong>Группа:</strong> {{ student.group.name }}</p>
            </div>

            <h5 class="mt-3">Кружки:</h5>
            <ul class="list-group list-group-flush mb-3">
                {% for club in student.clubs.all %}
                    <li class="list-group-item bg-transparent text-secondary">• {{ club.name }}</li>
                {% empty %}
                    <li class="list-group-item bg-transparent text-muted">Студент нигде не состоит</li>
                {% endfor %}
            </ul>

            <div class="d-grid gap-2">
                <a href="{% url 'student_list' %}" class="btn btn-secondary">Назад к списку</a>
            </div>
        </div>
    </div>
</body>
</html>
