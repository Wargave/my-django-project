<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
        .card { background-color: #3b3b70; border: 1px solid #176bbc; border-radius: 12px; }
        .card-header { background: linear-gradient(90deg, #1f6feb, #388bfd); color: white; font-weight: bold; }
        .form-control { background-color: #0d1117; border: 1px solid #2670b5; color: white; }
        .form-control:focus { background-color: #c50565; color: white; border-color: #1f6feb; box-shadow: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="card shadow-lg mx-auto" style="max-width: 400px;">
            <div class="card-header p-3 text-center">Вход в систему</div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="{% url 'register' %}" class="text-decoration-none text-primary">Еще нет аккаунта? Зарегистрируйтесь</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
